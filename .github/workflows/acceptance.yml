name: acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Artifact upload needs actions: write. Everything else stays read-only.
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daftar
          POSTGRES_PASSWORD: daftar-local-only
          POSTGRES_DB: daftar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daftar -d daftar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: daftar-local-only
      DATABASE_URL: postgresql://daftar_app:daftar-local-only@127.0.0.1:5432/daftar_test
      DATABASE_URL_SUPER: postgresql://daftar:daftar-local-only@127.0.0.1:5432/daftar_test
      WORKER_DATABASE_URL: postgresql://daftar_worker:daftar-local-only@127.0.0.1:5432/daftar_test
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_ACCESS_KEY: daftar
      S3_SECRET_KEY: daftar-local-only
      S3_BUCKET: statements
      IBAN_ENCRYPTION_KEY: dev-only-iban-key-change-me
      OCR_PROVIDER: local
      PDF_PROBE_MIN_CHARS: "30"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core
      - name: Install worker
        run: pip install -e "./worker[dev]" "moto[server]"
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml --redact --no-banner
      - name: Object storage stand-in
        run: |
          moto_server -p 59000 -H 127.0.0.1 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:59000/ >/dev/null && break; sleep 1; done
      - name: Test database
        run: psql -h 127.0.0.1 -U daftar -d postgres -c "CREATE DATABASE daftar_test OWNER daftar;"
      - name: Python acceptance tests
        working-directory: worker
        run: pytest -v --tb=short
      - name: Web acceptance tests
        run: npm ci && npm test
      - name: E2E database
        run: psql -h 127.0.0.1 -U daftar -d postgres -c "CREATE DATABASE daftar_e2e OWNER daftar;"
      # The Playwright Docker image no longer fits next to the runner's preinstalled toolchains
      # ("no space left on device" while pulling it). Drop the unused SDKs first.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af || true
          df -h /
      - name: Browser e2e (Docker / Linux node_modules)
        run: npm run test:e2e:docker
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
      - name: Upload source highlight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-highlight
          path: e2e/artifacts/source-highlight.png
          # Produced only when the grid-scroll e2e passes; do not mask the real test failure.
          if-no-files-found: warn
